<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <title th:text="#{admin.alum.list.page.title}">EnlacePro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <!-- NUESTROS ESTILOS E IMAGENES -->
    <link rel="stylesheet" type="text/css" th:href="@{/css/estilos.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/css/estilosCalendario.css}">
    <link rel="icon" type="image/png" th:href="@{/img/logo_EnlacePro.png}" />

    <!-- IMPORTACIONES DE CHART Y TAILWIND CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- NUESTROS JS -->
    <script defer th:src="@{/js/promptGlobal.js}"></script>
    <script defer th:src="@{/js/modoOscuro.js}"></script>


    <!-- CONFIGURACION TAILWIND -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                }
            }
        }
    </script>

    <!-- ESTILOS TAILWIND -->
    <style type="text/tailwindcss">
        @layer components {
      /* --- Estilos Base y Scroll --- */
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      
      .py-4 {
          padding-top: 7px !important;
          padding-bottom: 7px !important;
      }

      /* --- Sidebar Items Consolidados --- */
      .sidebar-item {
          display: flex;
          align-items: center;
          gap: 0.75rem;
          padding: 0.875rem 1rem;
          border-radius: 1rem;
          font-size: 0.875rem;
          line-height: 1.25rem;
          color: rgba(255, 255, 255, 0.5);
          transition: all 75ms cubic-bezier(0.4, 0, 0.2, 1);
      }
      .sidebar-item:hover {
          background: rgba(255, 255, 255, 0.05);
          color: #ffffff;
          transform: translateX(0.25rem);
      }
      .sidebar-item.active {
          background: linear-gradient(135deg, rgba(0, 15, 155, 0.3), rgba(106, 17, 203, 0.3), rgba(160, 0, 235, 0.2)) !important;
          color: #ffffff !important;
          border: 1px solid rgba(255, 255, 255, 0.15);
          box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
          font-weight: 600;
      }

      /* --- Icon Boxes Consolidados --- */
      .icon-box {
          width: 3rem;
          height: 3rem;
          border-radius: 1rem;
          display: flex;
          align-items: center;
          justify-content: center;
          background: linear-gradient(135deg, #000f9b, #6a11cb, #a000eb) !important;
          box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3), inset 0 0 10px rgba(255, 255, 255, 0.1);
          transition: transform 150ms cubic-bezier(0.4, 0, 0.2, 1);
          border-style: none;
          outline: 2px solid transparent;
          outline-offset: 2px;
      }
      .icon-box:hover { transform: scale(1.1); }
      .icon-box span { color: white !important; }

      /* --- Paneles Glassmorphism Consolidados --- */
      .glass-panel {
          position: relative;
          background: rgba(255, 255, 255, 0.08);
          border: 1px solid rgba(255, 255, 255, 0.12);
          backdrop-filter: blur(25px); /* Se mantiene el blur más alto de las dos definiciones */
          box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
          transition: all 75ms cubic-bezier(0.4, 0, 0.2, 1);
      }

      /* --- Navegación y Otros --- */
      .nav-group-title {
          padding: 1rem;
          font-size: 10px;
          text-transform: uppercase;
          letter-spacing: 2px;
          font-weight: 700;
          opacity: 0.4;
      }

      .task-card { background: rgba(255, 255, 255, 0.03); }

      .dropdown-item {
          @apply flex items-center gap-3 px-4 py-3 rounded-xl transition-all duration-200 text-sm font-medium;
          color: rgba(255, 255, 255, 0.7);
      }
      .dropdown-item:hover {
          background: rgba(255, 255, 255, 0.1);
          color: white;
      }

      .sidebar-border { border-color: rgb(255 255 255 / 0.1); }

      /* --- Modo Claro (Light Mode) Consolidado --- */
      .light-mode .glass-panel {
          background: rgba(255, 255, 255, 0.45);
          border: 1px solid rgba(255, 255, 255, 0.7);
          backdrop-filter: blur(40px) saturate(180%);
          box-shadow: 0 10px 40px rgba(0, 30, 120, 0.08), inset 0 0 0 1px rgba(255, 255, 255, 0.5);
      }
      .light-mode .sidebar-item { color: #1e293b; }
      .light-mode .sidebar-item:hover { background: rgba(0, 15, 155, 0.05); color: #000f9b; }
      .light-mode .sidebar-item.active {
          background: rgba(255, 255, 255, 0.9) !important;
          color: #000f9b !important;
          border: 1px solid rgba(255, 255, 255, 1);
          box-shadow: 0 4px 12px rgba(0, 15, 155, 0.1);
      }
      .light-mode h1, .light-mode h2, .light-mode h3, .light-mode #current-period, .light-mode .lang-link, .light-mode label, .light-mode span:not(.material-symbols-rounded) { 
          color: rgb(15 23 42); 
          opacity: 1;
          font-weight: 700;
      }
      .light-mode p { color: #64748b; }
      .light-mode .subtitle-text { color: rgb(100 116 139); font-weight: 500; }
      .light-mode .nav-group-title { color: #000f9b !important; opacity: 0.7 !important; }
      .light-mode .task-card { background: rgba(255, 255, 255, 0.5); border-color: rgba(255, 255, 255, 0.8); }
      .light-mode .dropdown-item { color: #475569; }
      .light-mode .dropdown-item:hover { background: rgba(0, 15, 155, 0.05); color: #000f9b; }
      .light-mode .sidebar-border { border-color: rgb(226 232 240); }
      .light-mode .user-name { color: rgb(15 23 42); }
      .light-mode .user-role { color: rgb(100 116 139); }

      /* --- Calendario y Formularios --- */
      .calendar-header-cell {
          display: flex; flex-direction: column; align-items: center; justify-content: center;
          padding: 1rem 0; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
          background: rgba(255, 255, 255, 0.04); border-bottom: 2px solid rgba(255, 255, 255, 0.05);
          transition: all 150ms ease;
      }
      .light-mode .calendar-header-cell { color: rgb(15 23 42); background: #f1f5f9; border-bottom-color: rgba(0, 15, 155, 0.05); }

      .time-column { background: rgba(255, 255, 255, 0.02); }
      .light-mode .time-column { background: #f8fafc; }

      .time-label { 
          font-size: 0.875rem; height: 60px; display: flex; align-items: center; justify-content: center;
          opacity: 0.4; font-weight: 700; border-right: 1px solid rgb(255 255 255 / 0.05);
      }
      .light-mode .time-label { color: rgb(30 41 59); opacity: 0.9; border-right-color: rgb(226 232 240); }

      .day-column { position: relative; border-left: 1px solid rgb(255 255 255 / 0.05); min-height: 480px; }
      .light-mode .day-column { border-left-color: rgba(0, 15, 155, 0.1); }

      .event { 
          position: absolute; left: 0.25rem; right: 0.25rem; border-radius: 0.75rem; padding: 0.75rem;
          font-size: 10px; overflow: hidden; border-left: 4px solid; box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
          transition: all 150ms ease; cursor: pointer;
      }
      .event:hover { transform: scale(1.02); z-index: 20; }
      .event-blue { background-color: #dbeafe !important; border-color: #3b82f6 !important; color: #1e40af !important; }
      .event-green { background-color: #dcfce7 !important; border-color: #10b981 !important; color: #065f46 !important; }
      .event-purple { background-color: #f3e8ff !important; border-color: #8b5cf6 !important; color: #5b21b6 !important; }

      .month-cell { min-height: 100px; padding: 0.5rem; display: flex; flex-direction: column; gap: 0.25rem; }
      .day-num { font-size: 0.75rem; font-weight: 700; opacity: 0.3; margin-bottom: 0.25rem; }
      .light-mode .day-num { color: rgb(15 23 42); opacity: 0.6; }

      .mini-event { 
          padding: 0.25rem 0.5rem; border-radius: 0.375rem; font-size: 9px; font-weight: 700;
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-left: 2px solid;
          box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      }

      .view-selector-btn {
          padding: 0.5rem 1.5rem; border-radius: 0.5rem; font-size: 0.75rem; font-weight: 700;
          transition: all 200ms ease;
      }
      .view-selector-btn.active { background-color: rgb(255 255 255); box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); color: rgb(67 56 202); }
      .view-selector-btn:not(.active) { opacity: 0.5; }
      .view-selector-btn:not(.active):hover { opacity: 1; }
      .light-mode .view-selector-btn.active { background-color: rgb(79 70 229); color: rgb(255 255 255); box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1); }

      .form-label { display: block; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; opacity: 0.6; margin-bottom: 0.25rem; }
      .form-input { 
          width: 100%; background-color: rgb(255 255 255 / 0.05); border: 1px solid rgb(255 255 255 / 0.1);
          border-radius: 0.75rem; padding: 0.75rem; font-size: 0.875rem; outline: none; transition: all 150ms ease;
      }
      .form-input:focus { border-color: rgb(99 102 241); }
      .light-mode .form-input { background-color: rgb(255 255 255); border-color: rgb(226 232 240); color: rgb(15 23 42); }
    }
  </style>

</head>

<body id="mainBody" class="overflow-hidden flex h-screen font-sans light-mode">

    <aside class="w-72 glass-panel m-5 rounded-[32px] flex flex-col z-10 transition-all duration-100 overflow-hidden">
        <div th:replace="fragments/sidebar :: sidebar"></div>
    </aside>

    <main class="flex-1 flex flex-col h-screen pr-5 overflow-y-auto no-scrollbar">
        <header th:replace="fragments/header :: header"></header>
        <div th:replace="${content} :: content"></div>
    </main>

</body>

</html>
