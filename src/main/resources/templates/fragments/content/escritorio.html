<div th:fragment="content" class="flex-1 flex flex-col min-h-0">
    <section class="flex-1 overflow-y-auto px-6 pb-4 no-scrollbar">
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
            <div class="glass-panel p-6 rounded-[28px] flex items-center gap-5 relative z-10 transition-all duration-100 overflow-hidden">
                <div class="w-14 h-14 rounded-2xl bg-indigo-500/10 flex items-center justify-center text-indigo-500">
                    <span class="material-symbols-rounded text-2xl">group</span>
                </div>
                <div class="relative z-10">
                    <h3 class="text-[11px] font-bold uppercase opacity-40" th:text="#{director.escritorio.total.alumnos}">Total Alumnos</h3>
                    <span class="text-2xl font-bold" id="stat-alumnos">0</span>
                </div>
            </div>

            <div class="glass-panel p-6 rounded-[28px] flex items-center gap-5 relative z-10 transition-all duration-100 overflow-hidden">
                <div class="w-14 h-14 rounded-2xl bg-blue-500/10 flex items-center justify-center text-blue-600">
                    <span class="material-symbols-rounded text-2xl">translate</span>
                </div>
                <div class="relative z-10">
                    <h3 class="text-[11px] font-bold uppercase opacity-40" th:text="#{director.escritorio.total.idiomas}">Idiomas</h3>
                    <span class="text-2xl font-bold" id="stat-idiomas">0</span>
                </div>
            </div>

            <div class="glass-panel p-6 rounded-[28px] flex items-center gap-5 relative z-10 transition-all duration-100 overflow-hidden">
                <div class="w-14 h-14 rounded-2xl bg-orange-500/10 flex items-center justify-center text-orange-500">
                    <span class="material-symbols-rounded text-2xl">today</span>
                </div>
                <div class="relative z-10">
                    <h3 class="text-[11px] font-bold uppercase opacity-40" th:text="#{director.escritorio.total.tareas}">Tareas Hoy</h3>
                    <span class="text-2xl font-bold" id="stat-tareas">0</span>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 glass-panel p-8 rounded-[32px] flex flex-col min-h-[432px] relative z-10 transition-all duration-100 overflow-hidden">
                <div class="flex items-center justify-between mb-5 relative z-10">
                    <div class="flex items-center gap-3">
                        <span class="material-symbols-rounded text-indigo-500">bar_chart</span>
                        <h3 class="text-xl font-bold" th:text="#{director.escritorio.grafica.titulo}">Matriculaciones</h3>
                    </div>
                </div>
                <div class="flex-1 w-full relative h-[320px] z-10">
                    <canvas id="chartIdiomas"></canvas>
                </div>
            </div>

            <div class="glass-panel p-8 rounded-[32px] flex flex-col min-h-[432px] relative z-10 transition-all duration-100 overflow-hidden">
                <div class="flex items-center gap-3 mb-5 relative z-10">
                    <span class="material-symbols-rounded text-blue-600">event_note</span>
                    <h3 class="text-xl font-bold" th:text="#{director.escritorio.total.tareas}">Tareas de Hoy</h3>
                </div>
                <div class="flex-1 overflow-y-auto no-scrollbar relative z-10" id="today-events-list"></div>
            </div>
        </div>
    </section>

    <script th:src="@{/js/escritorio.js}"></script>
    <script th:inline="javascript">
        /*<![CDATA[*/
        window.dashboardData = {
            alumnos: /*[[${alumnos}]]*/[],
            idiomas: /*[[${idiomas}]]*/[],
            totalTareas: /*[[${totalTareas}]]*/ 0
        };
        /*]]>*/
    </script>
</div>
