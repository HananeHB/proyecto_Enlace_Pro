<div th:fragment="content" class="flex flex-col flex-1 h-full min-h-0 overflow-hidden">
    <div class="flex flex-col flex-1 p-6 min-h-0">
        <div class="flex justify-between items-center mb-6 flex-shrink-0">
            <div class="flex gap-3">
                <a th:href="@{/web/enlacePro/admin/idiomas/pdf}"
                    class="glass-panel px-4 py-2 rounded-xl flex items-center gap-2 hover:bg-white/20 transition-all text-sm font-semibold">
                    <span class="material-symbols-rounded text-red-400">picture_as_pdf</span>
                    <span>PDF</span>
                </a>
            </div>
        </div>

        <div class="glass-panel rounded-[24px] overflow-hidden flex flex-col max-h-full">
            <div class="overflow-x-auto overflow-y-auto custom-scrollbar">
                <table class="w-full text-left border-collapse">
                    <thead class="sticky top-0 z-20">
                        <tr class="sidebar-border border-b bg-[#b9c0f3f2]/95 backdrop-blur-md">
                            <th class="p-4 text-xs font-bold uppercase tracking-wider opacity-60" th:text="#{admin.language.table.name}">Idioma</th>
                            <th class="p-4 text-xs font-bold uppercase tracking-wider opacity-60" th:text="#{admin.language.table.creationDate}">Fecha de creación</th>
                            <th class="p-4 text-xs font-bold uppercase tracking-wider opacity-60 text-right" th:text="#{admin.language.table.actions}">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="lista-idiomas-body" class="divide-y sidebar-border">
                        <tr th:each="i : ${idiomas}" class="hover:bg-white/5 transition-colors">
                            <td class="p-4">
                                <div class="flex items-center gap-3">
                                    <div class="w-8 h-8 rounded-lg bg-indigo-500/20 flex items-center justify-center">
                                        <span class="material-symbols-rounded text-indigo-400 text-lg">language</span>
                                    </div>
                                    <span class="font-semibold" th:text="${i.nombre}">Español</span>
                                </div>
                            </td>
                            <td class="p-4">
                                <div class="flex flex-col">
                                    <span class="text-sm font-medium" th:text="${#temporals.format(i.fechaCreacion, 'dd/MM/yyyy')}">01/01/2024</span>
                                    <span class="text-[10px] opacity-50" th:text="${#temporals.format(i.fechaCreacion, 'HH:mm')}">12:00</span>
                                </div>
                            </td>
                            <td class="p-4 text-right">
                                <div class="flex justify-end gap-2">
                                    <button type="button" class="w-9 h-9 flex items-center justify-center rounded-lg hover:bg-white/10 transition-all text-indigo-400"
                                        th:data-id="${i.id.value}" th:data-nombre="${i.nombre}" onclick="prepararEdicionIdioma(this)">
                                        <span class="material-symbols-rounded">edit</span>
                                    </button>
                                    <form th:action="@{/web/enlacePro/admin/idiomas/borrado}" method="post" class="inline">
                                        <input type="hidden" name="id" th:value="${i.id.value}" />
                                        <button type="button" class="w-9 h-9 flex items-center justify-center rounded-lg hover:bg-red-500/10 transition-all text-red-400"
                                            th:onclick="abrirConfirmacion(this.form, [[${i.nombre}]])">
                                            <span class="material-symbols-rounded">delete</span>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="overlay-confirm" class="modal-overlay fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] hidden items-center justify-center p-4">
        <div class="glass-panel glass-panel-modal max-w-md w-full rounded-[32px] p-8 text-center border border-white/20 shadow-2xl">
             <div class="w-20 h-20 bg-red-500/20 rounded-3xl flex items-center justify-center mx-auto mb-6">
                <span class="material-symbols-rounded text-red-500 text-5xl">warning</span>
            </div>
            <h2 class="text-2xl font-bold mb-2 text-white" th:text="#{admin.language.delete.confirm}">¿Estás seguro?</h2>
            <div class="bg-white/5 rounded-2xl p-4 mb-8 flex items-center justify-center gap-3 border border-white/10">
                <span class="material-symbols-rounded text-indigo-400">language</span>
                <span id="nombre-confirm" class="font-bold text-indigo-400 text-lg">Nombre</span>
            </div>
            <div class="flex gap-4">
                <button type="button" onclick="cerrarConfirmacion()" class="flex-1 px-6 py-3 rounded-xl border border-white/10 text-white">
                    <span th:text="#{admin.language.delete.cancel}">Cancelar</span>
                </button>
                <button type="button" id="btn-confirmar-borrado" class="flex-1 px-6 py-3 rounded-xl bg-red-500 text-white font-bold">
                    <span th:text="#{admin.language.delete}">Eliminar</span>
                </button>
            </div>
        </div>
    </div>

    <div id="edit-idioma-modal" class="modal-overlay fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] hidden items-center justify-center p-4">
        <div class="glass-panel glass-panel-modal max-sm:w-full max-w-sm rounded-[32px] p-8 border border-white/20 shadow-2xl text-white">
            <h2 class="text-xl font-bold mb-6" th:text="#{admin.language.editar.form.titulo}">Editar Idioma</h2>
            <form id="editIdiomaForm" th:action="@{/web/enlacePro/admin/idiomas/editado}" method="post" class="space-y-5">
                <input type="hidden" name="idiomaId" id="edit-id">
                <input type="text" name="nombre" id="edit-nombre" required class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 outline-none focus:border-indigo-500 text-white">
                <div class="flex gap-4 pt-4">
                    <button type="button" onclick="cerrarEditModalIdioma()" class="flex-1 px-6 py-3 rounded-xl border border-white/10">Cancelar</button>
                    <button type="submit" class="flex-1 px-6 py-3 rounded-xl bg-indigo-600 font-bold">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toast-idioma-edit" class="toast-exito-idioma">
        <span class="material-symbols-rounded">check_circle</span>
        <span th:text="#{admin.language.success.edit}">¡Idioma actualizado!</span>
    </div>

    <div id="toast-idioma-delete" class="toast-exito-idioma" style="background: rgba(239, 68, 68, 0.9);">
        <span class="material-symbols-rounded">delete_sweep</span>
        <span th:text="#{admin.language.success.delete}">¡Idioma eliminado!</span>
    </div>

    <script th:src="@{/js/listaIdioma.js}"></script>
</div>
