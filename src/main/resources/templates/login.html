<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <title>EnlacePro - Iniciar Sesión</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                }
            }
        }
    </script>

    <style type="text/tailwindcss">
        /* --- Estilos de Componentes --- */
        .glass-panel-login {
            background: rgba(255, 255, 255, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(40px) saturate(180%);
            box-shadow: 0 10px 40px rgba(0, 30, 120, 0.08), inset 0 0 0 1px rgba(255, 255, 255, 0.5);
        }

        .form-input-glass {
            width: 100%; 
            background-color: rgba(255, 255, 255, 0.6); 
            border: 1px solid rgb(226 232 240);
            border-radius: 1rem; 
            padding: 0.875rem 3.5rem 0.875rem 3rem; 
            font-size: 0.875rem; 
            outline: none; 
            transition: all 150ms ease;
            color: rgb(15 23 42);
        }

        .form-input-glass:focus {
            border-color: rgb(99 102 241);
            background-color: white;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        .icon-box-login {
            background: linear-gradient(135deg, #000f9b, #6a11cb, #a000eb) !important;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }

        .role-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.25rem;
            padding: 0.75rem 0.5rem;
            border-radius: 1rem;
            border-width: 1px;
            transition: all 200ms;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(0, 0, 0, 0.05);
            text-align: center;
            height: 100%;
        }

        .role-input:checked + .role-card {
            background: white !important;
            border-color: #000f9b;
            box-shadow: 0 4px 12px rgba(0, 15, 155, 0.1);
            transform: translateY(-2px);
        }

        /* --- Fondo del Layout --- */
        body.light-mode {
            background:
                radial-gradient(circle at 0% 0%, rgba(9, 87, 255, 0.25) 0%, transparent 50%),
                radial-gradient(circle at 100% 0%, rgba(9, 87, 255, 0.25) 0%, transparent 50%),
                radial-gradient(circle at 30% 100%, rgba(9, 87, 255, 0.25) 0%, transparent 50%),
                #f8fafc !important;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>

<body class="light-mode p-6 overflow-hidden">
    
    <div class="glass-panel-login w-full max-w-[480px] rounded-[40px] p-8 md:p-10 relative z-10">
        
        <div class="flex flex-col items-center mb-8">
            <div class="icon-box-login w-14 h-14 rounded-2xl flex items-center justify-center mb-4 transform hover:scale-110 transition-transform duration-200">
                <span class="material-symbols-rounded text-white text-3xl">school</span>
            </div>
            <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">EnlacePro</h1>
            <p class="text-slate-500 font-medium mt-2 text-center text-balance">Bienvenido al portal académico</p>
        </div>

        <form th:action="@{/web/enlacePro/login}" th:object="${usuario}" method="post" class="space-y-6">
            
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-8">
                <label class="relative cursor-pointer">
                    <input type="radio" name="role" value="alumno" class="role-input hidden" checked>
                    <div class="role-card">
                        <span class="material-symbols-rounded text-slate-400 text-xl">person</span>
                        <span class="text-[9px] font-bold uppercase tracking-tight text-slate-500">Alumnado</span>
                    </div>
                </label>
                <label class="relative cursor-pointer">
                    <input type="radio" name="role" value="profe" class="role-input hidden">
                    <div class="role-card">
                        <span class="material-symbols-rounded text-slate-400 text-xl">co_present</span>
                        <span class="text-[9px] font-bold uppercase tracking-tight text-slate-500">Profesorado</span>
                    </div>
                </label>
                <label class="relative cursor-pointer">
                    <input type="radio" name="role" value="director" class="role-input hidden">
                    <div class="role-card">
                        <span class="material-symbols-rounded text-slate-400 text-xl">shield_person</span>
                        <span class="text-[9px] font-bold uppercase tracking-tight text-slate-500">E. Directivo</span>
                    </div>
                </label>
                <label class="relative cursor-pointer">
                    <input type="radio" name="role" value="padres" class="role-input hidden">
                    <div class="role-card">
                        <span class="material-symbols-rounded text-slate-400 text-xl">family_restroom</span>
                        <span class="text-[9px] font-bold uppercase tracking-tight text-slate-500">Familias</span>
                    </div>
                </label>
            </div>

            <div th:if="${errorMessage}" class="flex items-center gap-2 p-3 rounded-xl bg-red-50 border border-red-100 text-red-600 text-xs font-semibold animate-in fade-in slide-in-from-top-1 duration-300">
                <span class="material-symbols-rounded text-lg">error</span>
                <p th:text="${errorMessage}"></p>
            </div>

            <div class="space-y-4">
                <div class="relative group">
                    <label class="text-[10px] font-bold uppercase tracking-[2px] opacity-60 ml-1 mb-2 block text-slate-900">Email / Usuario</label>
                    <div class="relative">
                        <span class="material-symbols-rounded absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xl group-focus-within:text-indigo-600 transition-colors">alternate_email</span>
                        <input type="text" th:field="*{mail}" placeholder="nombre@ejemplo.com" class="form-input-glass" required>
                    </div>
                </div>

                <div class="relative group">
                    <label class="text-[10px] font-bold uppercase tracking-[2px] opacity-60 ml-1 mb-2 block text-slate-900">Contraseña</label>
                    <div class="relative">
                        <span class="material-symbols-rounded absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xl group-focus-within:text-indigo-600 transition-colors pointer-events-none">lock</span>
                        
                        <input type="password" id="passwordInput" th:field="*{password}" placeholder="••••••••" class="form-input-glass" required>
                        
                        <button type="button" onclick="togglePassword()" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-indigo-600 transition-colors focus:outline-none">
                            <span id="eyeIcon" class="material-symbols-rounded text-xl">visibility</span>
                        </button>
                    </div>
                </div>
            </div>

            <button type="submit" id="loginBtn" class="w-full icon-box-login text-white py-4 rounded-2xl font-bold text-sm flex items-center justify-center gap-3 transition-all duration-200 hover:shadow-2xl hover:brightness-110 active:scale-[0.98]">
                <span>Acceder ahora</span>
                <span class="material-symbols-rounded text-xl">arrow_forward</span>
            </button>
        </form>

        <div class="mt-8 text-center">
            <a href="#" class="text-sm font-semibold text-indigo-600 hover:text-indigo-800 transition-colors">¿Has olvidado tu contraseña?</a>
        </div>
    </div>

    <script>
        // Función para mostrar/ocultar contraseña
        function togglePassword() {
            const passwordInput = document.getElementById('passwordInput');
            const eyeIcon = document.getElementById('eyeIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.innerText = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                eyeIcon.innerText = 'visibility';
            }
        }

        // Animación de carga al enviar el formulario
        document.querySelector('form').addEventListener('submit', function() {
            const btn = document.getElementById('loginBtn');
            btn.innerHTML = '<span class="material-symbols-rounded animate-spin">sync</span> <span>Verificando...</span>';
            btn.style.opacity = '0.8';
            btn.style.pointerEvents = 'none';
        });
    </script>

</body>
</html>
