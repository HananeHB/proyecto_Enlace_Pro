#==== Base de datos DEV ====
# La conexión se define en docker-compose.yml mediante variables de entorno

#=== JPA / Hibernate ====
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true

# Hace que Spring espere a que Hibernate cree las tablas antes de ejecutar data.sql
spring.jpa.defer-datasource-initialization=true

# Dialecto para MySQL 8
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Ejecuta data.sql siempre
spring.sql.init.mode=always

# Cierra la sesión JPA al salir de la capa de servicio
spring.jpa.open-in-view=false
